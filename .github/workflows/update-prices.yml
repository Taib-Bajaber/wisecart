name: WiseCart Price Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get WiseCart files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install chromium --with-deps

      - name: Verify Playwright
        run: |
          python -c "import playwright; print('Playwright installed successfully')"

      - name: Test Carrefour directly
        run: |
          python - <<'PY'
          import requests

          url = "https://www.carrefour.ke/mafken/en/c/FKEN1701240"

          response = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
              },
              timeout=30
          )

          print("Carrefour HTTP status:", response.status_code)
          print("Response length:", len(response.content))
          print("Server:", response.headers.get("server", ""))

          if response.status_code != 200:
              raise SystemExit(
                  f"Carrefour returned HTTP {response.status_code}"
              )

          print("Direct connection reached Carrefour.")

      - name: Collect Carrefour prices
        run: python collect_carrefour.py

      - name: Update WiseCart database
        run: python update_prices.py

      - name: Save updated prices
        run: |
          git config user.name "WiseCart"
          git config user.email "wisecart@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update supermarket prices"
          git push
